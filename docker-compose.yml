services:
  whatsapp-monitor:
    build: .
    container_name: whatsapp-monitor
    # Fixed hostname keeps Chromium's profile lock valid across container re-creation
    hostname: whatsapp-monitor
    ports:
      - "3000:3000"
    volumes:
      # Persist authentication data
      - whatsapp-auth:/app/.wwebjs_auth
      - whatsapp-cache:/app/.wwebjs_cache
      # Persist message logs
      - ./data:/app/data
      # Google Sheets credentials: put credentials.json in ./secrets (kept out of image and git).
      # A folder mount works even when no credentials file exists yet.
      - ./secrets:/app/secrets:ro
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    # Add security options for Chrome
    security_opt:
      - seccomp:unconfined
    # Increase shared memory size for Chrome
    shm_size: '2gb'

volumes:
  whatsapp-auth:
  whatsapp-cache:
